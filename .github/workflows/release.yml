name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm run tauri build

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=$(node --eval 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          DMG="src-tauri/target/release/bundle/dmg/Skillone_${VERSION}_aarch64.dmg"
          ls -la "$DMG"
          gh release create "v${VERSION}" "Skillone v${VERSION}" "$DMG" --repo "$GITHUB_REPOSITORY"
