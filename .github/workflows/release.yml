name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `version` input: pnpm/setup reads `packageManager` from
      # package.json, and passing a conflicting pin errors the workflow.
      # pnpm 11 ships a self-contained binary, so this needs no Node —
      # the explicit install step below stays for the frozen lockfile.
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Latest major: the repo publishes no v3/v4 tags (latest release v2.9.2).
      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm run tauri build

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=$(node --eval 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/skillone_*.dmg | head -n1)
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${DMG}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "${TAG}" "${{ steps.dmg.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish Homebrew Cask
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: skill-one/homebrew-tap
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          DMG_NAME="${{ steps.dmg.outputs.name }}"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG_NAME}"
          SHA256=$(shasum -a 256 "${{ steps.dmg.outputs.path }}" | awk '{print $1}')

          TMP=$(mktemp -d)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TMP"
          cd "$TMP"

          mkdir -p Casks
          cat > "Casks/skillone.rb" <<RUBY
          cask "skillone" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${DMG_URL}"
            name "skillone"
            desc "Find, install and manage agent skills (Tauri v2 desktop app)"
            homepage "https://github.com/skill-one/skillone"
            app "skillone.app"
          end
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/skillone.rb"
          git commit -m "skillone ${VERSION}" || echo "no changes"
          git push origin main
