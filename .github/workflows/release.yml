name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run tauri build

      - name: Upload artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.sig" \) | while read -r file; do
            echo "Uploading $file"
            gh release upload "${TAG}" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

  updater-manifest:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Build and upload multiplatform updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          NOTES="$(gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" --json body -q .body)"

          mkdir -p ./sigs
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir ./sigs || true

          node --input-type=module -e '
            import fs from "node:fs";
            const [version, notes] = process.argv.slice(1);
            const platforms = {};
            const files = fs.existsSync("./sigs") ? fs.readdirSync("./sigs") : [];

            for (const file of files) {
              if (!file.endsWith(".sig")) continue;
              const rawTarget = file.slice(0, -4);
              const signature = fs.readFileSync(`./sigs/${file}`, "utf8").trim();
              const urlTarget = rawTarget.replace(/ /g, ".");
              const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${urlTarget}`;

              if (file.endsWith(".app.tar.gz.sig") || file.includes("darwin-aarch64") || file.includes("aarch64.app.tar.gz")) {
                platforms["darwin-aarch64"] = { url, signature };
              } else if (file.endsWith(".nsis.zip.sig") || file.includes("windows-x86_64") || file.includes("x64-setup.nsis.zip")) {
                platforms["windows-x86_64"] = { url, signature };
              } else if (file.endsWith(".AppImage.tar.gz.sig") || file.includes("linux-x86_64") || file.includes("amd64.AppImage.tar.gz")) {
                platforms["linux-x86_64"] = { url, signature };
              }
            }

            const manifest = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$NOTES"

          gh release upload "${TAG}" latest.json --repo "$GITHUB_REPOSITORY" --clobber
