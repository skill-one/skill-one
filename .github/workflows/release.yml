name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `version` input: pnpm/setup reads `packageManager` from
      # package.json, and passing a conflicting pin errors the workflow.
      # pnpm 11 ships a self-contained binary, so this needs no Node —
      # the explicit install step below stays for the frozen lockfile.
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Latest major: the repo publishes no v3/v4 tags (latest release v2.9.2).
      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TAURI_SIGNING_PRIVATE_KEY makes `tauri build` also emit the updater
      # artifacts: bundle/macos/Skill One.app.tar.gz + .sig (minisign-signed;
      # independent from any Apple developer identity).
      - name: Build app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run tauri build

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${DMG}")" >> "$GITHUB_OUTPUT"

      - name: Locate updater artifact
        id: app
        shell: bash
        run: |
          TAR=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz | head -n1)
          echo "path=${TAR}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${TAR}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi

      # What the in-app updater reads from
      # .../releases/latest/download/latest.json. Only darwin-aarch64 ships
      # today (macos-14 runner); add platforms keys when new targets appear.
      #
      # The release is created first on purpose: `notes` is what the update
      # dialog shows the user, so it carries GitHub's generated body (commit
      # list + Full Changelog link) rather than a version placeholder.
      - name: Build updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIG_PATH: ${{ steps.app.outputs.path }}.sig
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          NOTES="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          node --input-type=module -e '
            import fs from "node:fs";
            const [version, tarName, sigPath, notes] = process.argv.slice(1);
            // GitHub replaces spaces with dots in release asset filenames.
            const urlName = tarName.replace(/ /g, ".");
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  url: `https://github.com/${process.env.GITHUB_REPOSITORY}` +
                    `/releases/download/v${version}/${urlName}`,
                  signature: fs.readFileSync(sigPath, "utf8").trim(),
                },
              },
            }, null, 2) + "\n");
          ' "$VERSION" "${{ steps.app.outputs.name }}" "$SIG_PATH" "$NOTES"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          gh release upload "v${VERSION}" \
            "${{ steps.dmg.outputs.path }}" \
            "${{ steps.app.outputs.path }}" \
            latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish Homebrew Cask
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: skill-one/homebrew-tap
        run: |
          VERSION="$(node --eval 'process.stdout.write(require("./package.json").version)')"
          TAG="v${VERSION}"
          DMG_NAME="${{ steps.dmg.outputs.name }}"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG_NAME}"
          SHA256=$(shasum -a 256 "${{ steps.dmg.outputs.path }}" | awk '{print $1}')

          TMP=$(mktemp -d)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TMP"
          cd "$TMP"

          mkdir -p Casks
          cat > "Casks/skill-one.rb" <<RUBY
          cask "skill-one" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${DMG_URL}"
            name "Skill One"
            desc "Find, install and manage agent skills (Tauri v2 desktop app)"
            homepage "https://github.com/skill-one/skill-one"
            app "Skill One.app"
          end
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/skill-one.rb"
          git commit -m "skill-one ${VERSION}" || echo "no changes"
          git push origin main
