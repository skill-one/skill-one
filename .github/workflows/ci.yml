name: ci

# Runs the checks that already exist locally. Neither is covered by
# `release.yml`, which only builds on a `v*` tag — so without this, a pushed
# branch could fail typecheck, lint, tests or even Rust compilation and
# nothing would notice until a release is attempted.
#
# `push` is limited to `main` so a pull request triggers exactly one run.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Read from .nvmrc so CI, local development and the `engines.node`
      # floor in package.json can never drift apart. Vite 8 needs Node
      # 20.19+/22.12+, react-router v8 needs 22.22+; 24 is the active LTS.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # No `version` input: pnpm/setup reads `packageManager` from
      # package.json, and passing a conflicting pin errors the workflow.
      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Fails on lint errors only; the remaining warnings are reported in the
      # log (see .oxlintrc.json for why each rule is on or off).
      - name: Lint
        run: pnpm lint

      # Type-aware rules (no-floating-promises, await-thenable, unbound-method,
      # ...) need a type graph, so they run as a separate step: `pnpm lint`
      # above stays instant, and this one only pays for the program build.
      - name: Lint (type-aware)
        run: pnpm lint:types

      # `test:coverage`, not `test:run`: the run is what enforces the
      # thresholds in `vite.config.ts`. Plain `vitest run` passes even when
      # coverage has fallen off a cliff, which makes the thresholds decorative.
      - name: Test
        run: pnpm test:coverage

      # The unit and component suites answer "does this behave". This one
      # answers "does the assembled app": real router, real CSS, real layout,
      # with the browser stand-in for the Rust backend. Its screenshot
      # baselines are committed, so a genuine visual change has to be reviewed
      # rather than absorbed by a re-run.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (end to end)
        run: pnpm test:e2e

  # Rust backend checks across macOS, Windows, and Linux to prevent platform-specific regressions.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'macos-14'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

