[package]
name = "app"
version = "0.27.1"
description = "Skill One"
authors = ["you"]
license = ""
repository = "https://github.com/skill-one/skill-one"
edition = "2021"
# agents-skills requires rustc >= 1.88 (edition 2024).
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# Desktop-only app: the rlib is what main.rs links; staticlib/cdylib are only
# needed for iOS/Android targets, which this app does not build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens external links (skill sources) in the system browser.
tauri-plugin-opener = "2"
# Fetches the skills.sh live search from the Rust side: the endpoint sends no
# CORS headers, so the webview cannot read it directly. Scoped to that one
# origin in `capabilities/default.json`.
tauri-plugin-http = "2"
# In-app self-update: fetches + verifies + installs signed releases from
# GitHub Releases; the process plugin provides relaunch() after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Skills install / agent management backed by the agents-skills library.
# Since 0.16 `Manager::list` reports a skill's `description` and
# `installed_at` itself, so the app no longer parses SKILL.md frontmatter;
# 0.19 reverted the token estimate 0.18 had briefly added; since 0.21 one
# source (`owner/repo@<skill>`) is one skill and a failure is an `Err`;
# since 0.22 a skill's identity is its directory basename alone; since 0.23
# remote installs download the repository tarball from codeload.github.com
# and match the skill locally, so the GitHub REST API (its anonymous rate
# limit) and GITHUB_TOKEN are no longer involved; since 0.24 a root-level
# SKILL.md is the fallback when no skill directory matches, installing the
# whole repository under the repository name; since 0.25 the agent table is
# regenerated from the upstream skill-one/agents-info and its `global` field
# is renamed `skills_dir` (fields this app never reads); since 0.26 the skill
# identity is the skills.sh-style slug — the install id is `owner/repo/slug`,
# remove/disable/enable share one `SelectionRequest`/`SelectionOutcome` pair,
# and `Manager::new` resolves home fallibly.
agents-skills = "0.28"
serde = { version = "1", features = ["derive"] }
# Required directly by the `tauri::generate_context!` macro (updater config).
serde_json = "1"
# Home directory resolution for the provenance ledger path
# (`<home>/.agents/skills/.skill-one.jsonl`).
dirs = "7"

[dev-dependencies]
tempfile = "3"
