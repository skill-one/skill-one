[package]
name = "app"
version = "0.14.0"
description = "Skill One"
authors = ["you"]
license = ""
repository = "https://github.com/skill-one/skill-one"
edition = "2021"
# agents-skills requires rustc >= 1.88 (edition 2024).
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# Desktop-only app: the rlib is what main.rs links; staticlib/cdylib are only
# needed for iOS/Android targets, which this app does not build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: menu bar tray; image-png: load the template tray icon from bytes;
# macos-private-api: required by the transparent popover window (macOSPrivateApi).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# Opens external links (skill sources) in the system browser.
tauri-plugin-opener = "2"
# Fetches the skills.sh live search from the Rust side: the endpoint sends no
# CORS headers, so the webview cannot read it directly. Scoped to that one
# origin in `capabilities/default.json`.
#
# Pinned to the minor the npm plugin ships (`@tauri-apps/plugin-http` 2.6.1 is
# its latest published package): `tauri build` refuses a Rust/npm mismatch,
# and the npm side lags the Rust crates here.
tauri-plugin-http = "2.6.1"
# In-app self-update: fetches + verifies + installs signed releases from
# GitHub Releases; the process plugin provides relaunch() after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Skills install / agent management backed by the agents-skills library.
# Since 0.16 `Manager::list` reports a skill's `description` and
# `installed_at` itself, so the app no longer parses SKILL.md frontmatter;
# 0.19 reverted the token estimate 0.18 had briefly added; since 0.21 one
# source (`owner/repo@<skill>`) is one skill and a failure is an `Err`;
# since 0.22 a skill's identity is its directory basename alone; since 0.23
# remote installs download the repository tarball from codeload.github.com
# and match the skill locally, so the GitHub REST API (its anonymous rate
# limit) and GITHUB_TOKEN are no longer involved.
agents-skills = "0.23"
serde = { version = "1", features = ["derive"] }
# Required directly by the `tauri::generate_context!` macro (updater config).
serde_json = "1"
# Home directory resolution for the provenance ledger path
# (`<home>/.agents/skills/.skill-one.json`).
dirs = "6"
# The skills.sh upstream content hash (see skill_hash.rs): SHA-256 plus the
# base-strength ICU collation that orders the hashed file paths.
sha2 = "0.10"
icu_collator = { version = "2", features = ["compiled_data"] }
# Menu bar popover material: real Liquid Glass (NSGlassEffectView) on macOS
# 26+, automatic NSVisualEffectView fallback on older macOS, no-op elsewhere.
tauri-plugin-liquid-glass = "0.1"

[dev-dependencies]
tempfile = "3"

# Activate the app when the tray popover opens: without real activation the
# previous frontmost app reclaims key focus and the popover blur-dismisses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
