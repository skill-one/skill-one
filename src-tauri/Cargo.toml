[package]
name = "app"
version = "0.1.4"
description = "Skill One"
authors = ["you"]
license = ""
repository = "https://github.com/skill-one/skillone"
edition = "2021"
# agents-skills requires rustc >= 1.88 (edition 2024).
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens external links (skill sources) in the system browser.
tauri-plugin-opener = "2"
# Skills install / agent management backed by the agents-skills library.
agents-skills = "0.9"
serde = { version = "1", features = ["derive"] }
# Frontmatter parsing for description extraction (same parser agents-skills uses;
# the library's own parser is private since 0.8).
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
